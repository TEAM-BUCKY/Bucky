; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:custom_g474re]
platform = ststm32
board = custom_g474re
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
include_dir = src

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D HAL_PCD_MODULE_ENABLED
    -D VARIANT_H=\"variant_generic.h\"
    -DADC_SAMPLINGTIME=ADC_SAMPLETIME_247CYCLES_5
    -D SPI_INTERFACES_COUNT=0
    -D EEPROM_FLASH_PAGE_NUMBER=255
    -Ofast
    -ffast-math
    -flto

lib_deps =
    EEPROM

extra_scripts = pre:create_variant.py

[env:custom_h562rg]
platform = ststm32
board = custom_h562rg
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
include_dir = src

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D HAL_PCD_MODULE_ENABLED
    -DADC_SAMPLINGTIME=ADC_SAMPLETIME_247CYCLES_5
    -D SPI_INTERFACES_COUNT=0
    ; The core's EEPROM emulation mis-locates its flash page on the dual-bank
    ; H562RG: it adds FLASH_BANK_SIZE to a FLASH_DATA_SECTOR of 127 that already
    ; spans the full 1MB, landing on 0x0817E000 -- 512KB past the end of flash.
    ; Reading that faults and wedges the CPU. 63 is the last 8KB sector of
    ; bank 2, i.e. 0x080FE000, and FLASH_BASE_ADDRESS is mandatory whenever
    ; FLASH_DATA_SECTOR is set.
    -D FLASH_DATA_SECTOR=63
    -D FLASH_BASE_ADDRESS=0x080FE000U
    -Ofast
    -ffast-math
    -flto

lib_deps =
    EEPROM

extra_scripts = pre:create_variant.py
