[project]
name = "bucky"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    # Extra SB3 algorithms (TQC / TRPO / ARS / QR-DQN) — released in lockstep with SB3.
    "sb3-contrib>=2.3",
    # Supervised state→action models (decision tree / random forest / MLP regressor).
    "scikit-learn>=1.4",
    # CMA-ES black-box optimizer for controller/param tuning.
    "cma>=3.3",
    "numpy>=1.26",
    "pettingzoo>=1.24",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "tensorboard>=2.17",
    "websockets>=12.0",
    "tqdm>=4.66",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "requests>=2.31",
]

[project.optional-dependencies]
learners-extra = ["d3rlpy>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27", "pybind11>=2.13.6"]
# Software-in-the-loop firmware simulator (bucky.firmware): builds robot/sim with CMake.
firmware = ["pybind11>=2.13.6"]
# Live pygame viewer for the firmware simulator (python -m bucky.firmware.viewer).
viewer = ["pygame-ce>=2.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

# Pull the CPU-only torch build (the VPS has no GPU); avoids the multi-GB CUDA wheels.
# To train on a GPU box instead, swap this index for a CUDA one and re-lock, e.g.:
#   [[tool.uv.index]]
#   name = "pytorch-cu124"
#   url = "https://download.pytorch.org/whl/cu124"
#   explicit = true
#   [tool.uv.sources]
#   torch = { index = "pytorch-cu124" }
# then `uv lock --refresh && uv sync`, and launch train.py with --device auto (or cuda).
# Note: for the tiny [64,64] MLP, CPU is usually faster — GPU is only worth it for
# much larger nets. Keep the CPU index as the committed default for the VPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bucky", "app"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "httpx>=0.27",
    "pybind11>=2.13.6",
]
